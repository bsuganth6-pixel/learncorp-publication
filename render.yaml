# Render Blueprint for the API (Express + MongoDB).
#
# Create it: Render dashboard -> New -> Blueprint -> pick this repository.
# Secrets marked `sync: false` are prompted for in the dashboard and never stored in git.
# The frontend is deployed separately on Vercel (Root Directory = frontend).
# Full walkthrough: docs/DEPLOYMENT.md
services:
  - type: web
    name: learncorp-api
    runtime: node
    rootDir: backend
    region: singapore            # closest Render region to India; keep it near your Atlas cluster
    plan: free                   # free sleeps after ~15 min idle (first request then takes ~30-60 s); use "starter" to stay awake
    buildCommand: npm ci --include=dev && npm run build   # --include=dev: tsc lives in devDependencies and NODE_ENV=production skips them
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production          # also turns on the Secure flag for the session cookie
      - key: TRUST_PROXY_HOPS
        value: "2"                 # Vercel's /api proxy + Render's load balancer; see docs/DEPLOYMENT.md before changing
      - key: COOKIE_NAME
        value: bp_session          # must match the frontend if you ever change it
      # Email. Render's free tier blocks outbound SMTP, so the HTTP provider is the default. To use SMTP instead
      # (paid instance), set EMAIL_PROVIDER=smtp and add SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS.
      - key: EMAIL_PROVIDER
        value: resend
      # ---- fill these in on the dashboard ------------------------------------------------
      - key: CLIENT_URL            # your site's https origin, e.g. https://learncorp-publication-blond.vercel.app
        sync: false                # (comma-separate more than one, first is used in emails). The API refuses to start without it.
      - key: EMAIL_FROM            # e.g. LearnCorp Publication <no-reply@your-domain.com> (an address you have verified with the provider)
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
